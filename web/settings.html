<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings — Feed bagging</title>
  <link rel="stylesheet" href="/site.css">
</head>
<body data-page="settings">
  <header class="top">
    <div class="brand">Feed bagging</div>
    <nav>
      <a href="/">Overview</a>
      <a class="active" href="/settings.html">Settings</a>
      <a href="/calibration.html">Calibration</a>
      <a href="/manual.html">Manual</a>
      <a href="/diagnostics.html">Diagnostics</a>
    </nav>
  </header>
  <main>
    <div id="banner" class="banner"></div>
    <p class="note">Sign in as <strong>operator</strong>. The factory password is in the project README. Saving settings does not enable the feeder or the servos. Transition thresholds shipped with the firmware are placeholders.</p>
    <form id="login" class="row">
      <label>Web password<input id="web-password" type="password" autocomplete="current-password"></label>
      <button type="submit">Use for this tab</button>
    </form>
    <form id="settings-form">
      <div class="grid">
        <label>Target weight (g)<input id="target_weight_g" name="target_weight_g" type="number"></label>
        <label>Lower limit (g)<input id="lower_limit_g" name="lower_limit_g" type="number"></label>
        <label>Upper limit (g)<input id="upper_limit_g" name="upper_limit_g" type="number"></label>
        <label>Coarse feeder (%)<input id="coarse_feeder_percent" name="coarse_feeder_percent" type="number"></label>
        <label>Medium feeder (%)<input id="medium_feeder_percent" name="medium_feeder_percent" type="number"></label>
        <label>Fine feeder (%)<input id="fine_feeder_percent" name="fine_feeder_percent" type="number"></label>
        <label>Coarse gate (%)<input id="coarse_gate_percent" name="coarse_gate_percent" type="number"></label>
        <label>Medium gate (%)<input id="medium_gate_percent" name="medium_gate_percent" type="number"></label>
        <label>Fine gate (%)<input id="fine_gate_percent" name="fine_gate_percent" type="number"></label>
        <label>Coarse to medium (g)<input id="coarse_to_medium_g" name="coarse_to_medium_g" type="number"></label>
        <label>Medium to fine (g)<input id="medium_to_fine_g" name="medium_to_fine_g" type="number"></label>
        <label>Fine cutoff (g)<input id="fine_cutoff_g" name="fine_cutoff_g" type="number"></label>
        <label>Overrun compensation (g)<input id="overrun_compensation_g" name="overrun_compensation_g" type="number"></label>
        <label>Stable weight (ms)<input id="stable_weight_ms" name="stable_weight_ms" type="number"></label>
        <label>Discharge (ms)<input id="discharge_ms" name="discharge_ms" type="number"></label>
        <label>Empty hopper (g)<input id="empty_hopper_g" name="empty_hopper_g" type="number"></label>
        <label>Servo move (ms)<input id="servo_move_ms" name="servo_move_ms" type="number"></label>
        <label>Bag debounce (ms)<input id="bag_presence_debounce_ms" name="bag_presence_debounce_ms" type="number"></label>
        <label>Bag removal timeout (ms)<input id="bag_removal_timeout_ms" name="bag_removal_timeout_ms" type="number"></label>
      </div>
      <button type="submit">Save machine settings</button>
    </form>
    <form id="password-form" class="row">
      <label>New web password<input id="next-password" type="password" minlength="8" autocomplete="new-password"></label>
      <button type="submit">Change web password</button>
    </form>
    <form id="network-form" class="row">
      <label>SSID<input name="ssid" maxlength="32"></label>
      <label>Wi-Fi password<input name="wifi_password" type="password" minlength="8" autocomplete="new-password"></label>
      <button type="submit">Save network</button>
    </form>
    <p id="result" class="note"></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
